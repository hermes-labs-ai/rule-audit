version = 1

[gate]
fast_budget_seconds = 8.0
full_required_local = false
adapter_status = "NATIVE_DEFAULT"
exclusions = [".git/**", ".pytest_cache/**", ".ruff_cache/**", "**/__pycache__/**", "vendor/**", "node_modules/**", "dist/**", "build/**"]

[adapter]
enabled = false
name = "native"
argv = []
minimum_version = ""

[lintlang]
# CI runs the checked-in standalone runner, which does not orchestrate this
# separate policy block. Keep the policy disabled instead of claiming coverage.
enabled = false
argv = ["lintlang", "scan", "--format", "json", "--fail-on", "review", "{files}"]
trigger_globs = ["**/AGENTS.md", "**/CLAUDE.md", "**/prompts/**", "**/*.prompt", ".codex/**", ".claude/**"]
timeout_seconds = 4.0
blocking_threshold = "MEDIUM"

[review]
provider = "hermes-pr-review"
argv = ["hermes-pr-review"]
timeout_seconds = 180.0
material_severities = ["critical", "major"]
material_categories = ["correctness", "security", "data-loss", "concurrency", "api-contract"]
fallback_argv = []

[[fast]]
name = "ruff"
argv = ["ruff", "check", "--select", "E4,E7,E9,F", "{files}"]
timeout_seconds = 6.0
globs = ["**/*.py"]

[[fast]]
name = "python-parse"
argv = ["python3", "-c", "import ast,pathlib,sys; [ast.parse(pathlib.Path(p).read_bytes(), filename=p) for p in sys.argv[1:]]", "{files}"]
timeout_seconds = 6.0
globs = ["**/*.py"]

[[fast]]
name = "diff-check"
argv = ["python3", ".hermes/hermes_gate_runner.py", "diff-check", "{files}"]
timeout_seconds = 4.0
globs = ["**/*"]

[[full]]
name = "ruff"
argv = ["ruff", "check", "--select", "E4,E7,E9,F", "."]
timeout_seconds = 60.0
globs = ["**/*"]

[[full]]
name = "pytest"
argv = ["python3", "-m", "pytest", "-q"]
timeout_seconds = 180.0
globs = ["**/*"]

[[repair]]
name = "ruff-fix"
argv = ["ruff", "check", "--fix", "{files}"]
timeout_seconds = 8.0
globs = ["**/*.py"]
